[package]
name = "sdocx-edit"
description = "Editable model, importer and writer for Samsung Notes .sdocx files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sdocx = { version = "1.1.0", features = ["render", "pdf"] }
resvg = "0.47"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
uuid = { version = "1", features = ["v1", "std", "rng"] }
rand = "0.9"
thiserror = "2"
zip = { version = "8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
png = "0.18"
